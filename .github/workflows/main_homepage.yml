name: Homepage Scraper (Original)

on:
  schedule:
    - cron: '0 0 * * 0' # 매주 일요일 실행
  workflow_dispatch:

jobs:
  run-homepage-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # homepage_scraper 폴더에 requirements.txt가 있다면 사용, 없다면 직접 설치
          if [ -f homepage_scraper/requirements.txt ]; then 
            pip install -r homepage_scraper/requirements.txt
          else
            pip install pandas requests beautifulsoup4
          fi

      - name: Run Original Scraper
        working-directory: ./homepage_scraper
        run: |
          # 스크립트 실행 (이 과정에서 두 csv 파일이 모두 생성되어야 함)
          python sdvx_song.py
          
          # (디버깅용) 파일이 잘 생성되었는지 로그로 확인
          echo "--- Files in homepage_scraper ---"
          ls -l

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 중요: 생성된 두 개의 CSV 파일을 모두 스테이징 영역에 추가합니다.
          # 경로: homepage_scraper/파일명
          git add homepage_scraper/sdvx_music_list.csv
          git add homepage_scraper/sdvx_music_list_processed.csv
          
          # 만약 해당 폴더의 모든 csv를 추가하고 싶다면 아래와 같이 써도 됩니다.
          # git add homepage_scraper/*.csv
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            # 커밋 메시지도 두 파일이 업데이트되었음을 명시
            git commit -m "Update sdvx_music_list and processed data"
            git push
          fi