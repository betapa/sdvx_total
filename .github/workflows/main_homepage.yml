name: Homepage Scraper (Original)

on:
  schedule:
    - cron: '0 0 * * 0' # 매주 일요일 실행 (필요 시 변경)
  workflow_dispatch:

jobs:
  run-homepage-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # homepage_scraper 폴더 내의 requirements.txt를 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f homepage_scraper/requirements.txt ]; then pip install -r homepage_scraper/requirements.txt; fi
          # 만약 requirements.txt가 없다면 아래 줄 주석 해제 후 직접 입력
          # pip install pandas requests beautifulsoup4

      # 작업 디렉토리를 homepage_scraper로 설정하여 스크립트 실행
      - name: Run Original Scraper
        working-directory: ./homepage_scraper
        run: |
          python sdvx_song.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 변경된 파일 경로가 homepage_scraper 폴더 내부이므로 경로 지정 필수
          git add homepage_scraper/sdvx_music_list.csv
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update sdvx_music_list.csv (Homepage)"
            git push
          fi