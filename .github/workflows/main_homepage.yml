name: Homepage Scraper (Original)

on:
  schedule:
    - cron: '0 0 * * 5' # 매주 금요일 00:00 UTC 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

jobs:
  run-homepage-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f homepage_scraper/requirements.txt ]; then 
            pip install -r homepage_scraper/requirements.txt
          else
            pip install pandas requests beautifulsoup4
          fi

      - name: Run Original Scraper
        run: |
          # 루트에서 경로를 포함하여 스크립트 실행
          python homepage_scraper/sdvx_song.py
          
          # 파일 생성 확인 (디버깅 경로도 수정)
          echo "--- Files in homepage_scraper ---"
          ls -l homepage_scraper/

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 파일 추가 (이전 대화에서 변경한 파일명 반영: _final.csv)
          git add homepage_scraper/sdvx_music_list.csv
          # 파이썬 코드에서 저장하는 이름이 _final.csv라면 아래와 같이 수정해야 함
          git add homepage_scraper/sdvx_music_list_final.csv 2>/dev/null || git add homepage_scraper/sdvx_music_list_processed.csv
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update sdvx music list data"
            git push
          fi
