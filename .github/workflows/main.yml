name: Update SDVX Data & Images

# 언제 실행할지 설정
on:
  schedule:
    # 매일 한국 시간 오전 4시 (UTC 19:00) 실행
    # (시간은 필요에 따라 조정하세요. 예: '0 0 * * 1' 은 매주 월요일)
    - cron: '0 19 * * *'
  # 수동으로 실행 버튼을 눌러서 돌릴 수 있게 함
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 저장소에 쓸 수 있는 권한 부여

    steps:
      # 1. 저장소의 코드를 가져옴 (이미지와 CSV도 같이 가져옴)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 파이썬 3.9 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 스크립트 실행
      # (기존 이미지가 있으면 스킵하고, 없으면 다운로드함)
      - name: Run scraping script
        run: python sdvx_song.py

      # 5. 변경 사항(새로운 이미지, 갱신된 CSV)이 있는지 확인하고 커밋 & 푸시
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경된 파일들을 스테이징 (CSV 및 sdvx_jackets 폴더)
          git add sdvx_music_list.csv sdvx_music_list_processed.csv sdvx_jackets/
          
          # 변경 사항이 있을 때만 커밋 수행 (없으면 에러 없이 통과)
          git commit -m "Auto-update: SDVX music list and jackets" || echo "No changes to commit"
          
          # 저장소로 업로드
          git push
