name: Scrape SDVX Data

on:
  repository_dispatch:
    types: [trigger-scrape]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 의존성 설치
      working-directory: ./userdata_scraper
      run: |
        pip install -r requirements.txt

    - name: 스크립트 실행
      working-directory: ./userdata_scraper
      env:
        M573SSID: ${{ github.event.client_payload.cookie }}
      run: |
        python user_data.py
        # 주의: 만약 파일명이 user_data(공홈).py 라면 아래와 같이 변경하세요
        # python "user_data(공홈).py"

    - name: 변경 사항 커밋 및 푸시
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update play data (Automated)"
        file_pattern: "userdata_scraper/*.csv"
