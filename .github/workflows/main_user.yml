name: Scrape SDVX Data

on:
  repository_dispatch:
    types: [trigger-scrape]  # 자바스크립트에서 보낼 이벤트 이름

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 리포지토리에 파일을 쓸 수 있는 권한 부여

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 의존성 설치
      run: |
        pip install -r requirements.txt

    - name: 스크립트 실행
      env:
        # 자바스크립트가 보낸 payload에서 cookie 값을 꺼내 환경변수로 주입
        M573SSID: ${{ github.event.client_payload.cookie }}
      run: |
        python user_data.py

    - name: 변경 사항 커밋 및 푸시
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update play data (Automated)"
        file_pattern: "*.csv"